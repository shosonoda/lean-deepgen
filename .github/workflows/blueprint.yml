name: Build and deploy pages

# Full build on GitHub: Lean project + blueprint (LeanArchitect, web version),
# deployed to GitHub Pages. Only runs in the public repository.
#
# The steps mirror ./script/generate.sh (build, extract, leanblueprint web,
# checkdecls, assemble site/). The PDF version and the API docs are not built
# here: the PDF is produced locally by ./script/generate.sh and published with
# ./script/publish-page.sh (see pages.yml); this workflow re-uses the PDF that
# is already on the gh-pages branch so that it stays available. (The previous version used
# leanprover-community/docgen-action, whose texlive step currently fails to
# install pygraphviz with recent pip.)
#
# Caching: leanprover/lean-action caches `.lake` (oleans of the project and of
# Mathlib), keyed by lean-toolchain and lake-manifest.json, and uses the Mathlib
# cache, so incremental runs are fast.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build project and extract blueprint
        uses: leanprover/lean-action@v1
        with:
          build-args: ":blueprint"
          use-github-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install leanblueprint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q graphviz libgraphviz-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Render blueprint (web)
        run: leanblueprint web

      - name: Check declarations referenced by the blueprint
        run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls

      - name: Assemble site
        run: |
          rm -rf site && mkdir -p site
          cp -R home_page/. site/
          cp -R blueprint/web site/blueprint
          touch site/.nojekyll

      # The PDF is not built here; keep the one last published from a local
      # build (./script/publish-page.sh pushes it to the gh-pages branch).
      - name: Reuse the published PDF, if any
        run: |
          if git fetch --quiet --depth 1 origin gh-pages 2>/dev/null &&
             git cat-file -e origin/gh-pages:blueprint.pdf 2>/dev/null; then
            git show origin/gh-pages:blueprint.pdf > site/blueprint.pdf
            echo "reused blueprint.pdf from gh-pages"
          else
            echo "no published PDF found; the site is deployed without it"
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
